name: Rakip fiyatlarını kontrol et

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: price-monitor-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Bulut fiyat kontrolünü başlat
        env:
          MONITOR_API_TOKEN: ${{ secrets.MONITOR_API_TOKEN }}
        run: |
          test -n "$MONITOR_API_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 600 \
            --request POST \
            --header "Authorization: Bearer $MONITOR_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            https://price-optimizer-database-api.onrender.com/v1/monitor
