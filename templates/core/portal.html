<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PriceOptimize - Hesaplayıcı Merkezi</title>
  <style>
    :root {
      --bg: #ecf5f7;
      --card: #ffffff;
      --line: #c8d6de;
      --text: #0f172a;
      --muted: #556274;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, #ffffff 0%, rgba(255, 255, 255, 0) 40%),
        linear-gradient(160deg, #dfeef2 0%, var(--bg) 58%);
      padding: 1rem;
    }
    .wrap {
      width: 100%;
      max-width: 900px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 20px 48px rgba(10, 29, 54, 0.10);
      padding: 1.4rem;
    }
    .hero {
      border-radius: 12px;
      background: linear-gradient(110deg, #0f766e 0%, #14b8a6 60%, #38bdf8 100%);
      color: #fff;
      padding: 1rem 1.1rem;
      margin-bottom: 1.1rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2.5vw, 2rem);
    }
    p {
      margin: 0.65rem 0 0;
      color: #e5f7f6;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 0.9rem;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.9rem;
      background: #fbfdff;
    }
    .item h2 {
      margin: 0 0 0.55rem;
      font-size: 1.1rem;
    }
    .item p {
      margin: 0 0 0.75rem;
      color: var(--muted);
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      padding: 0.55rem 0.85rem;
      border-radius: 9px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Hesaplayıcı Merkezi</h1>
      <p>Tum motorlar tek alan adinda toplanir. Yeni motorlar bu sayfaya eklenecek.</p>
    </section>

    <section class="grid">
      <article class="item">
        <h2>Fiyat-Talep Motoru</h2>
        <p>Iki veri noktasindan talep modeli kurar, optimum fiyati ve maksimum kazanci hesaplar.</p>
        <a class="btn" href="/price-demand/">Motora Git</a>
      </article>
    </section>
  </main>
</body>
</html>
