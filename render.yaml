services:
  - type: web
    name: price-optimizer-database-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_CA_CERT
        sync: false
      - key: DATABASE_API_TOKEN
        generateValue: true
